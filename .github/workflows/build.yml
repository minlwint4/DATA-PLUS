name: Build DataPlus Viewer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Create & Configure Flutter App
        run: |
          # 1. Flutter Project အသစ် တည်ဆောက်ခြင်း
          flutter create --org com.dataplus --project-name dataplus_viewer app
          cd app
          
          # 2. လိုအပ်သော WebView နှင့် URL Launcher Packages များ ထည့်သွင်းခြင်း
          flutter pub add webview_flutter url_launcher

          # 3. main.dart ဖိုင်ကို အစားထိုးထည့်သွင်းခြင်း
          cp ../lib/main.dart lib/main.dart

          # 4. စံချိန်မီ ပြီးပြည့်စုံသော AndroidManifest.xml ကို တိုက်ရိုက် ဖန်တီးခြင်း
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Internet ခွင့်ပြုချက် -->
              <uses-permission android:name="android.permission.INTERNET"/>
              
              <application
                  android:label="DATA PLUS"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <!-- dataplus:// scheme ရှာဖွေခွင့်ပြုချက် -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="dataplus" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF
          echo "Valid AndroidManifest.xml created successfully! ✅"

          # 5. Icon အစားထိုးခြင်း
          cd ..
          if [ -f "icon.png" ]; then
            for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/android/app/src/main/res/$dir
              cp icon.png app/android/app/src/main/res/$dir/ic_launcher.png
            done
            echo "Custom Icon applied! ✅"
          fi

      - name: Build Release APK
        run: |
          cd app
          flutter build apk --release

      - name: Sign APK with Release Key
        run: |
          RAW_APK=$(find app/build -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"

          keytool -genkeypair -v -keystore release.jks -alias dataplus -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "dataplus123" -keypass "dataplus123" \
            -dname "CN=DATA PLUS Viewer, OU=DataPlus, O=DataPlus, L=Yangon, ST=Yangon, C=MM"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          zip -d "$RAW_APK" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/MANIFEST.MF" || true
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_APK" DataPlus_Viewer_aligned.apk
          
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:dataplus123 --key-pass pass:dataplus123 \
            --ks-key-alias dataplus \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out DataPlus_Viewer.apk DataPlus_Viewer_aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataPlus-Viewer-APK
          path: DataPlus_Viewer.apk
